  inspect_missing: "missing"
  inspect_present: "present"
  license:
    insightface: "InsightFace pretrained models, including buffalo_l and inswapper_128: non-commercial research only. Contact InsightFace for a commercial grant."
    gfpgan: "GFPGAN code and the published v1.4 weights are Apache-2.0. The network incorporates StyleGAN2, which is under the NVIDIA Source Code License. This registry does not mark the weight as cleared for commercial use."
    codeformer: "CodeFormer weights are under the S-Lab License 1.0 and are limited to non-commercial research."
    occluder: "Operator-supplied xseg-style occlusion ONNX. This repository does not grant rights to that file. Confirm the license of the copy you downloaded. DeepFaceLab's own code is GPL-3.0 and is not included here."
    parser: "BiSeNet face-parsing ONNX. Common checkpoints are trained on CelebAMask-HQ, which is non-commercial research. Confirm the file you place on disk."
    hyperswap: "HyperSwap ONNX weights are published with the FaceFusion project. This repository does not include that code and does not grant commercial use of the weights."
    simswap: "SimSwap code and weights are CC BY-NC 4.0. Non-commercial research only. This repository does not include that source."
    ghost: "The GHOST / AEI-Net training code is Apache-2.0. The ONNX exports named ghost_1/2/3_256 are separate files. Confirm the checkpoint license. This registry does not mark them commercially cleared."
    crossface: "Operator-supplied ONNX that maps a 512-d ArcFace vector into a swapper embedding. This repository grants no rights to that file."
