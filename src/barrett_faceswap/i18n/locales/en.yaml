cli:
  prog_description: "Face swap for a still image or a video. Compliance enforcement defaults to off for development."
  swap_help: "Detect, align, swap, and paste. A video target is processed frame by frame."
  inspect_help: "Show model registry entries, license flags, and local file hashes."
  processors_help: "List registered frame processors."
  source: "Source face. A still photo, or a video of that person (face and voice). A video is sampled for an identity. When the target has audio, speech from that video is the voice reference unless --voice-reference is set."
  target: "Target image or video. The face in this file is replaced."
  output: "Where to write the image or video."
  config: "Path to the YAML config. Relative paths inside it resolve from the working directory."
  dry_run: "Skip ONNX inference. Useful when weights are not downloaded yet."
  enable_compliance: "Turn on consent, watermark, content filter, and audit for this run."
  lang: "Interface language: en or zh-CN. Overrides BARRETT_FACESWAP_LANG and ui.language."
  consent_file: "JSON consent manifest for the source likeness."
  acknowledge: "State that you are authorized to use the source likeness."
  consent_subject: "Subject id recorded with --acknowledge-authorized-use."
  consent_statement: "Optional acknowledgement text. A default sentence is stored when omitted."
  no_watermark: "Skip the visible label and embedded metadata. The skip is written to the audit log."
  disable_content_filter: "Disable the content filter. Refused unless the permission switch is set."
  content_filter_provider: "Override content_filter.provider for this run. A change requires the permission switch."
  content_filter_threshold: "Override the filter score threshold."
  no_block_on_minor: "Do not block on a minor signal. Requires the permission switch."
  processors: "Comma-separated processor names. Defaults to the config list."
  execution_provider: "Execution provider to prefer. Repeat the flag to set the order. CUDA is preferred when both are listed. tensorrt builds an engine cache. tensorrt.fp16 defaults to false."
  target_face_index: "Which target face to replace. 0 is the largest face."
  trim_start: "Video trim start in seconds. Requires a video target."
  trim_end: "Video trim end in seconds. Requires a video target."
  video_encoder: "Video encoder: libx264 or h264_nvenc."
  video_threads: "How many frames to process at once."
  no_audio: "Drop the source audio instead of muxing it back."
  voice_reference: "Reference clip (wav, mp3, or m4a). Overrides speech taken from a source video. The target must already have audio."
  no_voice: "Do not convert voice, even if a reference clip and the config would."
  voice_strength: "Clone strength from 0 to 1. 1 replaces the timbre. 0 keeps the original track. Default 1."
  voice_tau: "OpenVoice variation (tau) from 0 to 1. Default 0.3. Higher is more random, not a stronger clone."
  filter_every: "When compliance is on, filter every Nth video frame. The last frame is always included."
  enhancer_model: "Enhancer graph. gfpgan_1.4 is the default. codeformer uses fidelity weight 0.7 unless you set --enhancer-weight. Also gpen_bfr_512, gpen_bfr_1024, gpen_bfr_2048, and restoreformer_plus_plus."
  enhancer_blend: "Enhancer blend from 0 to 1. 1 replaces the crop with the restoration. With a parser file, only skin is blended."
  enhancer_weight: "CodeFormer fidelity from 0 to 1. Default 0.7. Ignored when the graph has no weight input."
  swapper_model: "Swapper graph. hyperswap_1a_256 is the default. Other names need their ONNX file and the matching embedding or source crop."
  occluder_model: "Occlusion graph: xseg_1, xseg_2, xseg_3, or sam2_refine. sam2_refine needs a local ONNX."
  compare_help: "Write a labeled contact sheet and a timing table for swapper and enhancer pairs."
  compare_frames: "How many frames of a video target to time. Images use one frame."
  compare_swappers: "Swapper to include. Repeat the flag. The default is every registered swapper."
  compare_enhancers: "Enhancer to include. Repeat the flag. The default is every registered enhancer."
  download_swapper: "Also download this swapper and its embedding converter. Repeat the flag."
  download_enhancer: "Also download this enhancer. Repeat the flag."
  download_occluder: "Also download this occluder. sam2_refine is not downloaded."
  pixel_boost: "Aligned crop size. 0 uses the model native size (or swap.resolution for inswapper)."
  many_faces: "Replace every detected face with the source identity."
  reference: "Reference still. The target face closest to this identity is replaced."
  face_map: "JSON file mapping source images to target indexes or reference stills."
  blend_mode: "Paste mode: alpha or poisson."
  color_transfer: "Color match: none, mean_std, lab, or histogram."
  video_mode: "Video path: disk (default) or pipe."
  eye_mode: "Eye handling: swap, blend (default, keep most of the target eyes), or target."
  with_enhancer: "Also run face_enhancer. Eye regions use enhancer.eye_blend."
  job_id: "Job id. Letters, digits, underscore, and hyphen."
  resume: "Continue a job from the last finished frame."
  jobs_help: "Queue a swap and resume it after an interruption."
  jobs_submit: "Save a job without running it."
  jobs_resume: "Run a saved job from its next frame."
  jobs_list: "List job ids and states."
  jobs_run: "Run the oldest pending or interrupted job."
  ui_help: "Launch the Gradio interface."
  benchmark_help: "Time the processor chain and print frames per second."
  host: "Host interface for the Gradio server."
  port: "Port for the Gradio server."
  share: "Ask Gradio for a temporary public share link."
  benchmark_frames: "How many frames to time."
  benchmark_width: "Frame width. A still passed with --source and --target is resized to this."
  benchmark_height: "Frame height. A still passed with --source and --target is resized to this."
  benchmark_source: "Still image used as the source identity. Together with --target, the benchmark detects that face instead of using the drawn fallback."
  benchmark_target: "Still image repeated for --frames. Pass it with --source so detection runs on a real face."
  benchmark_live: "Time a live session and print per-stage latency. Does not open a webcam."
  live_help: "Run the realtime webcam loop. Source embedding is computed once."
  camera: "Camera index for OpenCV. Default is live.camera."
  live_frames: "Stop after this many frames. 0 runs until the camera closes."
  no_preview: "Do not open a preview window."
  virtual_camera: "Optional v4l2loopback device, such as /dev/video2."
  commercial: "Refuse any model the registry marks commercial_use false."
  doctor_help: "Report execution providers, CUDA and cuDNN libraries, and model files."
  download_help: "Download buffalo_l and inswapper_128, verify sha256, and retry mirrors."
  download_with_gfpgan: "Also download the optional GFPGAN 1.4 ONNX."
  download_with_masks: "Also download xseg_1.onnx and bisenet_resnet_34.onnx into the mask paths. Their licenses are unverified and likely non-commercial."
  download_with_landmarks: "Also download 2dfan4.onnx into models/2dfan4.onnx. It refines 68 landmarks. The weight is MIT and this registry does not mark it commercially cleared."
  download_force: "Download again even when the local file already matches."
  download_from_dir: "Copy matching ONNX files from this directory before downloading. SHA-256 is still checked."
  wrote: "Wrote {path}"
  models_header: "Model registry"
  processors_header: "Processors"
