cli:
  prog_description: "Still-image face swap. Compliance enforcement defaults to off for development."
  swap_help: "Detect, align, swap, and paste one face into a still image."
  inspect_help: "Show model registry entries, license flags, and local file hashes."
  processors_help: "List registered frame processors."
  source: "Source image. The face identity comes from this file."
  target: "Target image. The face in this file is replaced."
  output: "Where to write the still image."
  config: "Path to the YAML config. Relative paths inside it resolve from the working directory."
  dry_run: "Skip ONNX inference. Useful when weights are not downloaded yet."
  enable_compliance: "Turn on consent, watermark, content filter, and audit for this run."
  lang: "Interface language: en or zh-CN. Overrides BARRETT_FACESWAP_LANG and ui.language."
  consent_file: "JSON consent manifest for the source likeness."
  acknowledge: "State that you are authorized to use the source likeness."
  consent_subject: "Subject id recorded with --acknowledge-authorized-use."
  consent_statement: "Optional acknowledgement text. A default sentence is stored when omitted."
  no_watermark: "Skip the visible label and embedded metadata. The skip is written to the audit log."
  disable_content_filter: "Disable the content filter. Refused unless the permission switch is set."
  content_filter_provider: "Override content_filter.provider for this run. A change requires the permission switch."
  content_filter_threshold: "Override the filter score threshold."
  no_block_on_minor: "Do not block on a minor signal. Requires the permission switch."
  processors: "Comma-separated processor names. Defaults to the config list."
  execution_provider: "Execution provider to prefer. Repeat the flag to set the order. CUDA is preferred when listed."
  target_face_index: "Which target face to replace. 0 is the largest face."
  wrote: "Wrote {path}"
  models_header: "Model registry"
  processors_header: "Processors"
config:
  not_found: "Config not found: {path}. Run from the repository root or pass --config."
  parse_error: "Could not parse {path}: {error}"
  not_mapping: "{path} must contain a YAML mapping."
  processors_empty: "processors must be a non-empty list."
  det_size: "detect.det_size must be a positive multiple of 32."
  provider_enum: "content_filter.provider must be one of: {allowed}."
  threshold: "content_filter.threshold must be between 0 and 1."
  providers_empty: "execution.providers must be a non-empty list."
  providers_unknown: "Unknown execution provider(s) {unknown}. Use: {allowed}."
  bad_language: "Unsupported language '{value}'. Use en or zh-CN."
  validation: "Config validation failed: {detail}"
  bad_sha: "A model sha256 pin must be 64 hex characters or null."
execution:
  unknown: "Unknown execution provider '{name}'. Use: {allowed}."
  skipped: "Execution provider '{name}' ({ort_name}) is not available in this onnxruntime build. Skipping it."
  none: "No ONNX Runtime execution provider is available. Install onnxruntime, or replace it with onnxruntime-gpu on NVIDIA machines."
  selected: "ONNX Runtime providers: {providers}"
  ort_missing: "onnxruntime is not installed. Install onnxruntime, or replace it with onnxruntime-gpu. Do not keep both wheels installed."
  tensorrt_deferred: "TensorRT was requested. Phase 1 passes the provider through and does not build an engine cache yet."
models:
  missing: "ONNX weights are not available. This repository does not ship them.\nMissing:\n{listing}\nDownload instructions: scripts/download_models.md\nInsightFace packs and inswapper weights are non-commercial research weights. See docs/COMPLIANCE.md.\nPass --dry-run to exercise the command without loading a model."
  unknown_role: "Unknown model role '{role}'."
  hash_mismatch: "SHA-256 mismatch for {role} ({path}). Expected {expected}, computed {actual}."
  hash_unpinned: "Loaded {role} from {path}. SHA-256 {sha256} is not pinned. Set models.{role}.sha256 to enforce it."
  hash_ok: "SHA-256 for {role} matches the pin."
  commercial_yes: "commercial use allowed by the weight license"
  commercial_no: "commercial use not granted (non-commercial research)"
  record: "{role}: {state} file={filename} alignment={alignment} input={input_size} {commercial} pin={pin} sha256={sha256} path={path} license={license}"
  inspect_missing: "missing"
  inspect_present: "present"
  license:
    insightface: "InsightFace pretrained models, including buffalo_l and inswapper_128: non-commercial research only. Contact InsightFace for a commercial grant."
detect:
  need_bgr: "The detector expects a BGR image with three channels."
  no_face: "No face scored above the detector threshold. Use a clearer still image, or lower detect.score_threshold."
  bad_index: "Face index {index} is outside 0..{last} (0 is the largest face)."
  not_scrfd: "This detector export is not a SCRFD keypoint graph (scores={scores}, boxes={boxes}, keypoints={keypoints}). Phase 1 expects buffalo_l det_10g.onnx. A RetinaFace graph needs a later adapter."
  unpaired: "Could not pair a SCRFD head of length {count}. The export layout is unexpected."
  stride: "Cannot infer an SCRFD stride from {count} anchors at input {det_size}. The graph may be a RetinaFace export rather than det_10g."
  anchor_grid: "Anchor grid size does not match the detector head."
  rank: "Unexpected detector tensor rank {shape}."
  debug_ignore: "Ignoring detector tensor with shape {shape}."
align:
  bad_size: "Alignment size must be positive."
  failed: "Could not estimate a similarity transform from the five landmarks."
swap:
  embedding_length: "Recognizer embedding length is {length}, expected 512."
  output_rank: "Swapper output rank is {rank}, expected NCHW."
  need_onnx: "Reading the inswapper emap matrix requires the onnx package."
  emap_size: "emap initializer has size {size}, expected {expected}."
  emap_missing: "{name} has no 'emap' initializer. inswapper_128.onnx carries this matrix; another swap architecture needs its own backend."
  inputs: "Swapper inputs are not an image plus a 512-d latent. Found: {found}"
vision:
  video: "{name} is a video. Phase 1 swaps still images. Video would skip a per-frame content filter, so this build refuses it."
  suffix: "Unsupported image type '{suffix}'. Use one of: {allowed}."
  missing: "Image not found: {path}"
  decode: "Could not decode image: {path}"
processor:
  unknown: "Unknown processor '{name}'. Known processors: {known}."
  enhancer_missing: "face_enhancer is registered and not implemented. Remove it from processors, or pass --dry-run. A later phase can attach GFPGAN or CodeFormer here."
  swapper_dry_run: "face_swapper dry-run: model files were not opened."
  enhancer_dry_run: "face_enhancer dry-run: enhancer weights are a Phase 2 hook."
  swapper_done: "face_swapper: source score {source_score}, target score {target_score}, index {index}."
  dry_run_banner: "DRY-RUN"
pipeline:
  progress: "processors"
consent:
  read: "Could not read consent record {path}: {error}"
  not_object: "Consent record must be a JSON object."
  missing_fields: "Consent record is missing: {fields}."
  statement_short: "Consent statement must be at least 10 characters."
  expired: "Consent record expired on {day}."
  need_subject: "Pass --consent-subject together with --acknowledge-authorized-use."
  bad_date: "{field} must be an ISO date YYYY-MM-DD."
  need_one: "Compliance is enabled. Provide --consent-file or --acknowledge-authorized-use with --consent-subject."
  both: "Pass either --consent-file or --acknowledge-authorized-use, not both."
  default_ack: "Operator acknowledges the source likeness is authorized for this run."
watermark:
  label: "AI-generated"
  channels: "Watermark expects a three-channel BGR image."
  suffix: "Cannot write '{suffix}'. Use .png or .jpg."
  ffmpeg_missing: "ffmpeg is not on PATH. Wrote a metadata sidecar and left the container unchanged."
  ffmpeg_failed: "ffmpeg could not copy the container. The metadata sidecar was written."
  ffmpeg_ok: "ffmpeg wrote comment metadata."
  container_comment: "{text}. Produced by {software}."
  disabled_logged: "Watermark disabled by --no-watermark. This run is in the audit log."
  config_blocked: "compliance.watermark.enabled is false. Pass --no-watermark so the unlabeled output is explicit and audited."
audit:
  append_failed: "Could not append to the audit log {path}: {error}"
filter:
  unknown_provider: "Unknown content filter provider '{provider}'. Use: {allowed}."
  threshold: "Content filter threshold must be between 0 and 1."
  custom_empty: "content_filter.provider is 'custom' but content_filter.custom_entrypoint is empty. Set it to 'module:factory'."
  permission: "Refusing to weaken or retarget the content filter without permission. Set BARRETT_FACESWAP_ALLOW_FILTER_DISABLE=1 or configs/admin.toml allow_filter_disable = true. To opt into nudenet or custom, set content_filter.provider in the YAML. Requested change: {reasons}."
  unregistered: "No content filter provider named '{provider}' is registered. Known: {known}."
  none_reason: "Content filter is disabled for this run."
  stub_warning: "Content filter provider 'stub' is active. No real detector is loaded. The frame is allowed. Opt into nudenet or a custom provider to score pixels. This check does not replace consent."
  stub_reason: "{role}: no real detector is loaded; stub allowed the frame."
  nudenet_write: "Could not write a temporary frame for NudeNet."
  nudenet_shape: "NudeNet detect() did not return a list of detections."
  nudenet_block: "{role}: NudeNet score {score} passed the threshold {threshold}."
  nudenet_allow: "{role}: NudeNet found no blocked label at or above {threshold}. NudeNet does not classify minors."
  nudenet_missing: "content_filter.provider is 'nudenet', but the nudenet package is not installed. This backend is opt-in: pip install nudenet. It is not a project dependency, and it does not detect minors. See docs/COMPLIANCE.md."
  custom_form: "custom_entrypoint must look like 'package.module:factory'."
  custom_load: "Could not load custom content filter '{entrypoint}': {error}"
  custom_assess: "Custom provider '{entrypoint}' did not return an object with assess()."
  blocked: "Content filter blocked the {role} image: {reason}"
  minor_blocked: "Content filter blocked the {role} image because a minor signal was set."
compliance:
  disabled_note: "Compliance enforcement is disabled. Development default: runs proceed without a consent check, watermark, or content-filter block. Set compliance.enabled to true or pass --enable-compliance for any real likeness."
  enabled_note: "Compliance enforcement is on."
