  inspect_present: "present"
  license:
    insightface: "InsightFace pretrained models, including buffalo_l and inswapper_128: non-commercial research only. Contact InsightFace for a commercial grant."
    gfpgan: "GFPGAN code and the published v1.4 weights are Apache-2.0. The network incorporates StyleGAN2, which is under the NVIDIA Source Code License. This registry does not mark the weight as cleared for commercial use."
    codeformer: "CodeFormer weights are under the S-Lab License 1.0 and are limited to non-commercial research."
    occluder: "xseg-style occlusion ONNX. The facefusion-assets xseg_1.onnx file has an unverified license and is likely non-commercial. DeepFaceLab's own code is GPL-3.0 and is not included here. This repository does not grant rights to the weight."
    parser: "BiSeNet face-parsing ONNX. The facefusion-assets bisenet_resnet_34.onnx file has an unverified license and is likely non-commercial. Common checkpoints are trained on CelebAMask-HQ, which is non-commercial research."
    hyperswap: "HyperSwap ONNX weights are published with the FaceFusion project. This repository does not include that code and does not grant commercial use of the weights."
    simswap: "SimSwap code and weights are CC BY-NC 4.0. Non-commercial research only. This repository does not include that source."
    ghost: "The GHOST / AEI-Net training code is Apache-2.0. The ONNX exports named ghost_1/2/3_256 are separate files. Confirm the checkpoint license. This registry does not mark them commercially cleared."
    crossface: "Operator-supplied ONNX that maps a 512-d ArcFace vector into a swapper embedding. This repository grants no rights to that file."
    blendswap: "BlendSwap 256 ONNX from the facefusion-assets pack. The upstream license is non-commercial. This repository does not grant commercial use."
    gpen: "GPEN blind face restoration ONNX (512, 1024, or 2048). The published packs are non-commercial research. This repository does not grant commercial use."
    restoreformer: "RestoreFormer++ ONNX. The published weights are non-commercial research. This repository does not grant commercial use."
    sam2: "Optional SAM 2 style mask refiner. The operator supplies models/sam2_refine.onnx. This repository does not download it. SAM 2 code is Apache-2.0. The coarse xseg file stays non-commercial."
    fan: "2DFAN (2dfan4.onnx) is the 2018 FAN landmark model by Adrian Bulat, published as breadbread1984 under the MIT license and redistributed via facefusion-assets. This registry does not mark the weight as cleared for commercial use."
