# Barrett FaceSwap defaults.
# Relative paths resolve from the current working directory.
# Run commands from the repository root.

ui:
  # zh-CN | en. The Gradio header toggle and --lang override this.
  # Precedence stays --lang, then BARRETT_FACESWAP_LANG, then this value.
  language: zh-CN

paths:
  models_dir: models
  outputs_dir: outputs

# Paths and optional sha256 pins. License, commercial flag, alignment template,
# and input size live in the model registry (see inspect-models).
models:
  detector:
    path: models/det_10g.onnx
    sha256: null
  recognizer:
    path: models/w600k_r50.onnx
    sha256: null
  # Optional 68-point refiner. A missing file keeps the detector landmarks.
  landmark:
    path: models/2dfan4.onnx
    sha256: null
  swapper:
    path: models/inswapper_128.onnx
    sha256: null
  # Optional. Used only when the processor or mask asks for them.
  gfpgan:
    path: models/gfpgan_1.4.onnx
    sha256: null
  codeformer:
    path: models/codeformer.onnx
    sha256: null
  occluder:
    path: models/occlusion_xseg.onnx
    sha256: null
  parser:
    path: models/bisenet_face_parsing.onnx
    sha256: null
  # Optional swapper backends. A run only opens the model selected by swap.model.
  hyperswap_1a:
    path: models/hyperswap_1a_256.onnx
    sha256: null
  hyperswap_1b:
    path: models/hyperswap_1b_256.onnx
    sha256: null
  hyperswap_1c:
    path: models/hyperswap_1c_256.onnx
    sha256: null
  simswap_256:
    path: models/simswap_256.onnx
    sha256: null
  simswap_512:
    path: models/simswap_unofficial_512.onnx
    sha256: null
  ghost_1:
    path: models/ghost_1_256.onnx
    sha256: null
  ghost_2:
    path: models/ghost_2_256.onnx
    sha256: null
  ghost_3:
    path: models/ghost_3_256.onnx
    sha256: null
  crossface_hyperswap:
    path: models/crossface_hyperswap.onnx
    sha256: null
  crossface_simswap:
    path: models/crossface_simswap.onnx
    sha256: null
  crossface_ghost:
    path: models/crossface_ghost.onnx
    sha256: null

enhancer:
  # gfpgan_1.4 | codeformer | gpen_bfr_512 | gpen_bfr_1024 | gpen_bfr_2048 | restoreformer_plus_plus
  model: gfpgan_1.4
  # 1 keeps the restoration. 0 keeps the original crop.
  # 0.6 leaves more of the swapped face, which keeps hair from looking over-sharpened.
  blend: 0.6
  # Lower than blend so the target eyes stay. 1 would replace them with the restoration.
  eye_blend: 0.35
  # When the face barely moves, mix this much of the previous enhanced crop. 0 turns it off.
  temporal: 0.4
  # Mean landmark shift divided by face width. Above this, the previous crop is dropped.
  temporal_motion: 0.04
  # CodeFormer fidelity. GFPGAN ignores it. 0.7 is the default when CodeFormer is selected.
  weight: 0.7

masks:
  # A missing file falls back to the all-ones or ellipse stub. Nothing is downloaded.
  occlusion: true
  parser: true
  # Set true when the occlusion graph predicts the occluder instead of the visible face.
  occlusion_invert: false
  # xseg_1 | xseg_2 | xseg_3 | sam2_refine. sam2_refine is a local ONNX.
  occluder_model: xseg_1
  # Video and live run the ONNX masks every N frames and warp the last mask
  # while the face barely moves. 1 runs them on every frame. Still images
  # always run them. Stride 3 reuses the warped mask for two frames. A landmark
  # jump still recomputes, so a stable face does not flicker.
  stride: 3
  stride_motion: 0.04
  regions:
    - skin
    - left_eyebrow
    - right_eyebrow
    - left_eye
    - right_eye
    - eye_glasses
    - nose
    - mouth
    - upper_lip
    - lower_lip

video:
  # libx264 is the CPU default. h264_nvenc needs an NVIDIA driver.
  encoder: libx264
  # disk writes frames. pipe decodes and encodes without a PNG per frame.
  mode: disk
  threads: 4
  # While compliance is on, the content filter sees every Nth frame plus the last.
  filter_every_n_frames: 30
  keep_audio: true
  crf: 18
  # A frame with no face is left unchanged. This is how many missed frames the
  # identity tracker remembers before it drops the track. It does not paste the last box.
  max_face_gap: 10
  # one_euro | ema | none
  smooth: one_euro

execution:
  # First available provider wins; CPU is the portable fallback.
  providers: [cuda, cpu]
  device_id: 0
  # fp32 is what CI runs. fp16 selects a sibling *_fp16.onnx when that file exists.
  precision: fp32
  # CUDA graph capture and IO binding apply only when the CUDA provider is installed.
  cuda_graph: false
  # Refuses every registry row with commercial_use false. The built-in rows stay false.
  commercial: false
  tensorrt:
    engine_cache: .cache/tensorrt/engines
    timing_cache: .cache/tensorrt/timing
    # fp16 changes identity. Leave this false unless a still has been checked.
    fp16: false
    builder_optimization_level: 3

live:
  # 1 keeps the newest camera frame and drops the rest.
  queue_size: 1
  detect_every: 3
  preview: true
  camera: 0

detect:
  det_size: 640
  # 0.5 is the open-app default. Advanced starts the slider here.
  # A lower value finds more faces and also more false positives.
  score_threshold: 0.5
  nms_threshold: 0.4

swap:
  # hyperswap_1a_256 is the quality default. inswapper_128 remains available.
  # | hyperswap_1b_256 | hyperswap_1c_256
  # | simswap_256 | simswap_unofficial_512 | blendswap_256
  # | ghost_1_256 | ghost_2_256 | ghost_3_256 | inswapper_128
  model: hyperswap_1a_256
  resolution: 128
  # 0 keeps the native size (inswapper also honors resolution).
  pixel_boost: 0
  # index | many | reference | map
  selector: index
  similarity: 0.45
  track: true
  track_iou: 0.3

blend:
  mask_blur: 15
  # alpha | poisson
  mode: alpha
  # none turns color match off. lab is the default mean/std match in Lab.
  # mean_std | histogram remain available.
  color: lab
  # swap keeps the swapped eyes. blend (default) mixes the target eyes back.
  # target keeps the original eyes.
  eye_mode: blend
  # Unsharp amount inside the eye mask. 0 disables it.
  eye_sharpen: 0.6

landmarks:
  # auto runs 2dfan4 when models/2dfan4.onnx exists. The five alignment points
  # are replaced only for a profile or a low-score face. always replaces every
  # face. off does not open the file. 68 points are kept either way so
  # expression can read the eyes and the mouth.
  # auto | always | off
  refine: auto
  min_score: 0.65
  profile_ratio: 0.22

expression:
  # Paste target eyes, and a pursed mouth, from the 68-point hull.
  # Closed eyes use more of the target. Open eyes stay on the swap.
  # When this is on and 68 points exist, blend.eye_mode is not applied.
  enabled: true
  eye_base: 0.05
  eye_boost: 0.85
  mouth_base: 0.0
  mouth_boost: 0.55
  eye_dilate: 3
  mouth_dilate: 1
  eye_expand: 1.35
  mouth_expand: 1.15
  ear_open: 0.24
  ear_closed: 0.15
  mar_open: 0.045
  mar_closed: 0.012
  blur: 9

jobs:
  root: jobs

# face_enhancer is registered and stays out of this list, including for video.
# The page opens on this stack: hyperswap_1a_256, landmarks.refine auto,
# occluder xseg_1, expression paste on, pixel_boost 0, providers cuda then cpu,
# tensorrt.fp16 false. Fast, Balanced, and High in the UI keep the enhancer off.
# Add face_enhancer, or pass --with-enhancer, only when a still needs restoration.
processors:
  - face_swapper

# The nested block is the production profile. It stays dormant while the
# master switch is false, so local dry-runs are not blocked.
compliance:
  enabled: false
  consent:
    required: true
  watermark:
    enabled: true
    # null uses the active locale label (AI-generated / 人工智能生成).
    text: null
    # Optional TTF or OTF for glyphs the built-in bitmaps do not cover. Null is valid.
    font_path: null
  content_filter:
    # none | stub | nudenet | custom
    # stub is a no-op that allows the frame and logs that no detector is loaded.
    enabled: true
    provider: stub
    threshold: 0.6
    block_on_minor: true
    custom_entrypoint: null
  audit:
    enabled: true
    path: outputs/audit/audit.jsonl
