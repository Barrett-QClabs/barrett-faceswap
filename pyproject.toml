[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barrett-faceswap"
version = "0.4.0"
description = "barrett-faceswap — open-source AI face swap & voice cloning in one click: deepfake-quality video, image and real-time webcam face swap with multi-face mapping, a FaceFusion / Deep-Live-Cam alternative with bilingual Chinese-English UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Barrett-QClabs" }]
keywords = ["face-swap", "onnxruntime", "insightface", "computer-vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "onnx>=1.15",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# The base install does not pin an ONNX Runtime wheel. Choose one extra.
#   pip install -e ".[cpu,dev]"
#   pip install -e ".[gpu]"
# Do not install both wheels. The CPU build can hide the GPU build.
# RTX 50-series (Blackwell, sm_120) with driver 580: onnxruntime-gpu 1.31 needs
# CUDA 13 and cuDNN 9. The extra installs those libraries. Provider setup calls
# onnxruntime.preload_dlls() and prepends site-packages/nvidia/*/lib.
cpu = ["onnxruntime>=1.17"]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]
ui = ["gradio>=4.44,<6"]
# Optional OpenVoice V2 tone-color converter. Do not pip-install OpenVoice's
# own requirements.txt: it pins numpy 1.22 and Gradio 3. Install that package
# with --no-deps after this extra. RTX 5090 needs a PyTorch wheel built with
# CUDA 12.8 or newer (sm_120). See docs/en/voice.md.
voice = [
  "torch>=2.7",
  "torchaudio>=2.7",
  "librosa>=0.10",
  "soundfile>=0.12",
  "scipy>=1.11",
  "unidecode>=1.3",
  "inflect>=7",
  "eng-to-ipa>=0.0.2",
  "pypinyin>=0.50",
  "cn2an>=0.5.22",
  "jieba>=0.42",
  "langid>=1.1",
]
dev = ["pytest>=8.0", "gradio>=4.44,<6"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2"]

[project.scripts]
barrett-faceswap = "barrett_faceswap.cli:main"

[project.urls]
Homepage = "https://github.com/Barrett-QClabs/barrett-faceswap"
Documentation = "https://github.com/Barrett-QClabs/barrett-faceswap/blob/main/docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
barrett_faceswap = ["py.typed", "i18n/locales/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
